<header
  class="fixed inset-x-0 top-0 z-50 border-b border-line bg-surface/80 backdrop-blur-md"
>
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a href="#inicio" class="flex items-center gap-2.5" (click)="closeMenu()">
      <img src="/images/logo.png" alt="DUOMAN" class="h-10 w-auto" />
      <span class="text-xl font-extrabold tracking-tight">DUOMAN</span>
    </a>

    <div class="hidden items-center gap-1 lg:flex">
      @for (link of links; track link.id) {
        <a
          [href]="link.href"
          class="rounded-lg px-3 py-2 text-sm font-medium transition"
          [class.text-primary]="active() === link.id"
          [class.hover:bg-surface-2]="active() !== link.id"
          [class.text-muted]="active() !== link.id"
          [class.hover:text-ink]="active() !== link.id"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        aria-label="Cambiar tema"
        class="rounded-lg p-2.5 text-muted transition hover:bg-surface-2 hover:text-ink"
        (click)="toggleTheme()"
      >
        @if (!theme()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        }
      </button>

      <a href="#cotizaciones" class="btn btn-primary hidden !px-5 !py-2.5 text-sm sm:inline-flex">
        Solicitar cotización
      </a>

      <button
        type="button"
        aria-label="Abrir menú"
        class="rounded-lg p-2.5 text-ink transition hover:bg-surface-2 lg:hidden"
        (click)="menuOpen.set(!menuOpen())"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-6 w-6">
          @if (!menuOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          }
        </svg>
      </button>
    </div>
  </nav>

  @if (menuOpen()) {
    <div class="border-t border-line bg-surface px-4 pb-6 pt-2 lg:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.id) {
          <a
            [href]="link.href"
            class="rounded-lg px-3 py-2.5 text-sm font-medium"
            [class.text-primary]="active() === link.id"
            [class.text-muted]="active() !== link.id"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
        <a href="#cotizaciones" class="btn btn-primary mt-3" (click)="closeMenu()">
          Solicitar cotización
        </a>
      </div>
    </div>
  }
</header>
