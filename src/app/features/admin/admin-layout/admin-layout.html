<div class="admin-shell">
  <aside class="admin-sidebar" [class.is-open]="menuOpen()" role="complementary">
    <div class="close-area">
      <button type="button" class="icon-btn" aria-label="Cerrar menú" (click)="closeMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="admin-brand">
      <img src="/images/logo.png" alt="DUOMAN" class="admin-logo" />
    </div>

    <nav class="admin-nav" aria-label="Navegación admin">
      @for (item of nav; track item.path) {
        <a
          routerLink="{{ item.path }}"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="admin-side-footer">
      <button
        type="button"
        aria-label="Cambiar tema"
        class="theme-toggle"
        (click)="theme.toggle()"
      >
        @if (!theme.dark()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        }
        {{ theme.dark() ? 'Modo claro' : 'Modo oscuro' }}
      </button>

      <button type="button" class="btn btn-outline w-full mt-2" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </aside>

  @if (menuOpen()) {
    <div class="backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }

  <main class="admin-content">
    <header class="admin-topbar">
      <button type="button" class="icon-btn hamburger" aria-label="Abrir menú" (click)="toggleMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <img src="/images/logo.png" alt="DUOMAN" class="admin-logo topbar-logo" />
    </header>

    <router-outlet />
  </main>
</div>
